<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHINS admin report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/phins-theme.css">
<link rel="stylesheet" href="/phins-document.css">
<script src="/phins-doc-return.js"></script>
<script src="/ui-clarity.js"></script>
<style>
  body { margin: 0; background: #f4f7fb; color: #142033; font-family: Inter, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 64px; }
  h1, h2 { font-family: "Space Grotesk", Inter, sans-serif; }
  .banner { background: linear-gradient(135deg, #060d1f 0%, #0d1b3e 100%); color: #f7f4ea; border-radius: 16px; padding: 22px; }
  .gold { color: #e3bf6f; letter-spacing: 0.04em; font-size: 0.78rem; text-transform: uppercase; }
  .answer { font-size: 1.05rem; line-height: 1.55; margin: 14px 0 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  button, .linkish {
    border: 1px solid rgba(227, 191, 111, 0.7); background: rgba(227, 191, 111, 0.14);
    color: inherit; border-radius: 999px; padding: 8px 12px; cursor: pointer; font: inherit;
  }
  .banner button { color: #f7e2a0; }
  .card { background: white; border-radius: 14px; padding: 16px 18px; margin-top: 14px; box-shadow: 0 8px 24px rgba(6, 13, 31, 0.06); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; color: #546e7a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  input, select { padding: 8px 10px; border-radius: 8px; border: 1px solid #d5deea; font: inherit; color: #142033; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid #e6edf5; }
  .seal { font-family: ui-monospace, monospace; font-size: 0.75rem; word-break: break-all; color: #37506e; }
  .warn { background: #fff6e8; border-radius: 12px; padding: 12px 14px; }
  .desks { display: flex; flex-wrap: wrap; gap: 8px; }
  .desks a { color: #0d47a1; text-decoration: none; background: #eef4ff; border-radius: 999px; padding: 6px 10px; font-size: 0.82rem; }
  .ask { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask input { flex: 1; min-width: 220px; }
  html[dir="rtl"] body { text-align: right; }
</style>
</head>
<body>
<div class="wrap">
  <header class="banner">
    <div class="gold" id="eyebrow">Admin AI &amp; BI</div>
    <h1 id="title" style="margin:6px 0 0;font-size:1.45rem;">Report</h1>
    <p class="answer" id="answer"></p>
    <div class="bar">
      <button type="button" id="lang-en">English</button>
      <button type="button" id="lang-he">עברית</button>
      <button type="button" id="dl-json">JSON</button>
      <button type="button" id="dl-md">Markdown</button>
      <button type="button" id="dl-html">HTML</button>
    </div>
  </header>
  <section class="card" id="planning" hidden></section>
  <section class="card">
    <h2 style="margin-top:0;font-size:1.05rem;" id="variants-title">Variants</h2>
    <form id="variants" class="grid"></form>
    <div class="bar"><button type="button" id="apply" style="background:#0d1b3e;color:#f7e2a0;">Apply</button></div>
    <div class="desks" id="affiliated" style="margin-top:12px;"></div>
  </section>
  <section class="card">
    <h2 style="margin-top:0;font-size:1.05rem;" id="ask-title">Ask a follow-up</h2>
    <div class="ask">
      <input id="ask-input" type="text" placeholder="Ask from the stored books">
      <button type="button" id="ask-btn" style="background:#0d1b3e;color:#f7e2a0;">Ask</button>
    </div>
  </section>
  <section class="card" id="tables"></section>
  <section class="card">
    <h2 style="margin-top:0;font-size:1.05rem;" id="desk-title">Dashboards</h2>
    <div class="desks" id="desks"></div>
  </section>
  <section class="card">
    <h2 style="margin-top:0;font-size:1.05rem;" id="seal-title">Integrity</h2>
    <p class="seal" id="seal"></p>
  </section>
</div>
<script>
(function () {
  var report = null;
  var lang = "en";
  var params = new URLSearchParams(window.location.search);
  var reportId = params.get("id") || "";

  function token() {
    return localStorage.getItem("phins_token") || "";
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function text(id, value) {
    var node = document.getElementById(id);
    if (node) node.textContent = value;
  }

  function copy(block) {
    if (!block) return "";
    return block[lang] || block.en || "";
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    text("variants-title", lang === "he" ? "תרחישים" : "Variants");
    text("ask-title", lang === "he" ? "שאלת המשך" : "Ask a follow-up");
    text("desk-title", lang === "he" ? "לוחות" : "Dashboards");
    text("seal-title", lang === "he" ? "שלמות" : "Integrity");
    text("apply", lang === "he" ? "החל" : "Apply");
    text("ask-btn", lang === "he" ? "שאל" : "Ask");
    if (!report) return;
    text("title", report.report_id || "");
    text("answer", copy(report.answer));
    renderPlanning();
    renderVariants();
    renderAffiliated();
    renderTables();
    renderDesks();
    renderSeal();
  }

  function renderPlanning() {
    var node = document.getElementById("planning");
    var plan = report && report.planning;
    if (!plan) { node.hidden = true; node.innerHTML = ""; return; }
    node.hidden = false;
    node.className = "card warn";
    node.innerHTML = "<strong>" + esc(lang === "he" ? plan.name_he : plan.name_en) + "</strong><p>" +
      esc(lang === "he" ? plan.reason_he : plan.reason_en) + "</p>" +
      (plan.url ? "<a href=\"" + esc(plan.url) + "\">" + esc(plan.url) + "</a>" : "");
  }

  function renderVariants() {
    var form = document.getElementById("variants");
    var schema = (report.variants && report.variants.schema) || [];
    var applied = (report.variants && report.variants.applied) || {};
    form.innerHTML = schema.map(function (field) {
      var label = lang === "he" ? field.label_he : field.label_en;
      var value = applied[field.key];
      if (field.type === "enum") {
        var options = (field.values || []).map(function (item) {
          return "<option value=\"" + esc(item) + "\"" + (String(item) === String(value) ? " selected" : "") + ">" + esc(item) + "</option>";
        }).join("");
        return "<label>" + esc(label) + "<select name=\"" + esc(field.key) + "\">" + options + "</select></label>";
      }
      return "<label>" + esc(label) + "<input name=\"" + esc(field.key) + "\" value=\"" + esc(value) + "\"></label>";
    }).join("");
  }

  function renderAffiliated() {
    var node = document.getElementById("affiliated");
    node.innerHTML = (report.affiliated || []).map(function (item, index) {
      var label = lang === "he" ? item.label_he : item.label_en;
      return "<button type=\"button\" data-aff=\"" + index + "\">" + esc(label) + "</button>";
    }).join("");
  }

  function renderTables() {
    var node = document.getElementById("tables");
    var facts = report.facts || {};
    var rows = (facts.open_normal && facts.open_normal.rows) || [];
    var decades = facts.decades || [];
    var html = "";
    if (rows.length) {
      html += "<h2 style=\"margin-top:0;font-size:1.05rem;\">" + (lang === "he" ? "גילאים בזנב" : "Ages in the tail") + "</h2>";
      html += "<table><thead><tr><th>Age</th><th>Lives</th><th>i(x)</th><th>ADL 3</th><th>Healthy</th></tr></thead><tbody>";
      rows.forEach(function (row) {
        html += "<tr><td>" + esc(row.age) + "</td><td>" + esc(row.lives) + "</td><td>" +
          esc(row.disability_incidence_per_life) + "</td><td>" + esc(row.adl3_average_years) +
          "</td><td>" + esc(row.healthy_curtate_years) + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    if (decades.length) {
      html += "<h2 style=\"font-size:1.05rem;\">" + (lang === "he" ? "עשורים" : "Decades") + "</h2><table><thead><tr><th>Band</th><th>Lives</th></tr></thead><tbody>";
      decades.forEach(function (row) {
        html += "<tr><td>" + esc(row.age_min) + "–" + esc(row.age_max) + "</td><td>" + esc(row.lives) + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    var customer = facts.customer;
    if (customer && customer.customer_id) {
      html += "<h2 style=\"font-size:1.05rem;\">" + esc(customer.customer_id) + "</h2>";
      html += "<p>" + esc(JSON.stringify({
        policies: (customer.policies || []).length,
        claims: (customer.claims || []).length,
        underwriting: (customer.underwriting || []).length,
        billing: (customer.billing || []).length
      })) + "</p>";
    }
    node.innerHTML = html || "<p>" + (lang === "he" ? "אין טבלת גילאים בשאלה הזו." : "This question has no age table.") + "</p>";
  }

  function renderDesks() {
    var node = document.getElementById("desks");
    node.innerHTML = (report.dashboards || []).filter(function (row) { return row.admin_open; }).map(function (row) {
      var label = lang === "he" ? row.label_he : row.label_en;
      return "<a href=\"" + esc(row.path) + "\">" + esc(label) + "</a>";
    }).join("");
  }

  function renderSeal() {
    var integrity = report.integrity || {};
    text("seal", (integrity.formula_id || "") + " · " + (integrity.facts_sha256 || "") +
      (integrity.read_only ? " · read only" : ""));
  }

  function show(next) {
    if (!next || !next.report_id) {
      text("answer", (next && next.error) || "Report unavailable");
      return;
    }
    report = next;
    lang = report.lang === "he" ? "he" : lang;
    try { sessionStorage.setItem("phins-aibi-" + report.report_id, JSON.stringify(report)); } catch (err) {}
    if (report.report_id && report.report_id !== reportId) {
      reportId = report.report_id;
      history.replaceState(null, "", "/admin-ai-report.html?id=" + encodeURIComponent(reportId));
    }
    applyLang();
  }

  async function fetchReport(id) {
    var response = await fetch("/api/admin/ai-bi/reports/" + encodeURIComponent(id), {
      headers: { "Authorization": "Bearer " + token() }
    });
    var data = await response.json();
    if (!response.ok) throw new Error(data.error || "Report unavailable");
    return data;
  }

  async function ask(question, variants) {
    var response = await fetch("/api/admin/ai-bi/query", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token(), "Content-Type": "application/json" },
      body: JSON.stringify({ question: question, variants: variants || {}, lang: lang })
    });
    var data = await response.json();
    if (!response.ok) throw new Error(data.error || "Query refused");
    show(data);
  }

  function readVariants() {
    var applied = Object.assign({}, (report.variants && report.variants.applied) || {});
    document.querySelectorAll("#variants [name]").forEach(function (field) {
      applied[field.name] = field.value;
    });
    return applied;
  }

  async function download(format) {
    var response = await fetch(
      "/api/admin/ai-bi/reports/" + encodeURIComponent(report.report_id) +
      "/download?format=" + format + "&lang=" + lang,
      { headers: { "Authorization": "Bearer " + token() } }
    );
    var data = await response.json();
    if (!response.ok) { text("answer", data.error || "Download refused"); return; }
    var blob = new Blob([data.content], { type: data.media_type || "text/plain" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = data.filename || ("report." + format);
    link.click();
    URL.revokeObjectURL(link.href);
  }

  document.getElementById("lang-en").onclick = function () { lang = "en"; applyLang(); };
  document.getElementById("lang-he").onclick = function () { lang = "he"; applyLang(); };
  document.getElementById("dl-json").onclick = function () { download("json"); };
  document.getElementById("dl-md").onclick = function () { download("md"); };
  document.getElementById("dl-html").onclick = function () { download("html"); };
  document.getElementById("apply").onclick = function () {
    ask(report.question, readVariants()).catch(function (err) { text("answer", err.message); });
  };
  document.getElementById("ask-btn").onclick = function () {
    var value = document.getElementById("ask-input").value.trim();
    if (!value) return;
    ask(value, {}).catch(function (err) { text("answer", err.message); });
  };
  document.getElementById("affiliated").onclick = function (event) {
    var button = event.target.closest("[data-aff]");
    if (!button || !report) return;
    var item = (report.affiliated || [])[Number(button.getAttribute("data-aff"))];
    if (!item) return;
    var nextVariants = Object.assign({}, (report.variants && report.variants.applied) || {}, item.variants || {});
    ask(item.question || report.question, item.question ? (item.variants || {}) : nextVariants)
      .catch(function (err) { text("answer", err.message); });
  };

  var cached = null;
  try { cached = JSON.parse(sessionStorage.getItem("phins-aibi-" + reportId) || "null"); } catch (err) { cached = null; }
  if (cached && cached.report_id) show(cached);
  if (reportId) {
    fetchReport(reportId).then(function (fresh) {
      if (!report || (fresh.integrity && report.integrity && fresh.integrity.facts_sha256 !== report.integrity.facts_sha256)) {
        show(fresh);
      }
    }).catch(function (err) {
      if (!report) text("answer", err.message);
    });
  } else if (!report) {
    text("answer", "Open this window from the admin mic.");
  }
})();
</script>
</body>
</html>
