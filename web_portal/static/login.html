<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#060d1f" />
  <title>PHINS Portal — Login</title>
  <link rel="icon" type="image/svg+xml" href="/phins-logo.svg">
  <link rel="apple-touch-icon" href="/phins-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #060d1f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      overflow-x: hidden;
    }
    .auth-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1000px 600px at 80% -10%, rgba(21, 68, 155, 0.55), transparent 60%),
        radial-gradient(800px 520px at 8% 110%, rgba(11, 92, 130, 0.4), transparent 60%),
        radial-gradient(600px 400px at 50% 45%, rgba(30, 82, 170, 0.22), transparent 65%),
        #060d1f;
    }
    .auth-backdrop::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(127, 178, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127, 178, 255, 0.05) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(900px 620px at 50% 40%, rgba(0,0,0,0.85), transparent 78%);
      -webkit-mask-image: radial-gradient(900px 620px at 50% 40%, rgba(0,0,0,0.85), transparent 78%);
    }
    .login-container {
      width: 100%;
      max-width: 450px;
      padding: 16px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: rgba(249, 251, 255, 0.97);
      border-radius: 22px;
      padding: 52px;
      box-shadow: 0 30px 80px rgba(2, 8, 23, 0.65), 0 0 0 1px rgba(127, 178, 255, 0.22);
      border-top: 3px solid #e3bf6f;
    }
    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo {
      margin-bottom: 16px;
    }
    .login-logo img {
      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 8px 24px rgba(18, 63, 130, 0.35));
    }
    .login-title {
      font-family: 'Space Grotesk', sans-serif;
      color: #0d2a5c;
      margin: 0 0 8px 0;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .login-subtitle {
      color: #5a6b85;
      margin: 0;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 22px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #0d2a5c;
      font-size: 0.95rem;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #dde7f5;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s;
      background: #f8fbff;
    }
    .form-group input:focus {
      outline: none;
      border-color: #c9a24b;
      box-shadow: 0 0 0 4px rgba(201, 162, 75, 0.14);
      background: #fff;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f7e2a0 0%, #e3bf6f 100%);
      color: #071022;
      border: none;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 0 1px rgba(184, 137, 59, 0.35), 0 8px 26px rgba(227, 191, 111, 0.35);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(184, 137, 59, 0.55), 0 12px 34px rgba(227, 191, 111, 0.5);
    }
    .btn-submit:disabled {
      background: #9aa7bd;
      color: #f2f5fa;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .aux-links {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
    }
    .aux-links a {
      color: #14509e;
      text-decoration: none;
      font-weight: 500;
    }
    .aux-links a:hover {
      color: #0d2a5c;
      text-decoration: underline;
    }
    .aux-links .sep {
      margin: 0 10px;
      color: #9aa7bd;
    }
    #login-msg {
      margin-top: 16px;
      text-align: center;
      font-weight: 600;
    }
    
    /* CAPTCHA Styles */
    .captcha-box {
      background: #f0f5fd;
      border: 1.5px solid #d7e4f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .captcha-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .captcha-box label {
      color: #0d2a5c;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .captcha-box label::before {
      content: '';
      width: 20px;
      height: 20px;
      background: url('/phins-logo.svg') center / contain no-repeat;
    }
    .captcha-refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(20, 80, 158, 0.1);
      color: #14509e;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .captcha-refresh:hover {
      background: rgba(20, 80, 158, 0.2);
      transform: rotate(90deg);
    }
    .captcha-question {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0d2a5c;
      background: #fff;
      border: 1px solid #e3ecf9;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
      user-select: none;
      min-height: 1.4em;
    }
    .captcha-question.loading {
      color: #90a4ae;
      font-style: italic;
    }
    .captcha-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #dde7f5;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
      font-weight: 600;
      background: #fff;
    }
    .captcha-input:focus {
      border-color: #c9a24b;
      outline: none;
    }
    
    /* OTP Verification Styles */
    .otp-box {
      background: #fdf8ec;
      border: 1.5px solid #ecd9a8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
    }
    .otp-box.active {
      display: block;
    }
    .otp-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .otp-header span {
      font-size: 1.5rem;
    }
    .otp-header h3 {
      margin: 0;
      color: #8a6d2e;
      font-size: 1.1rem;
    }
    .otp-info {
      font-size: 0.9rem;
      color: #7a601f;
      margin-bottom: 15px;
    }
    .otp-input-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }
    .otp-digit {
      width: 45px;
      height: 55px;
      border: 2px solid #e3cf96;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      background: #fff;
    }
    .otp-digit:focus {
      border-color: #b8893b;
      outline: none;
      box-shadow: 0 0 0 3px rgba(184, 137, 59, 0.2);
    }
    .otp-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }
    .otp-resend {
      color: #8a6d2e;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .otp-resend:disabled, .otp-resend.disabled {
      color: #999;
      cursor: not-allowed;
    }
    .trust-device {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #5a6b85;
    }
    .trust-device input {
      width: auto;
    }
    
    /* Step Indicator */
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .step {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #dbe4f2;
      transition: all 0.3s;
    }
    .step.active {
      background: #c9a24b;
      width: 24px;
      border-radius: 5px;
    }
    .step.complete {
      background: #4caf50;
    }
    
    /* Mobile Responsive */
    @media screen and (max-width: 480px) {
      .login-container {
        padding: 12px;
      }
      .login-card {
        padding: 28px 20px;
        border-radius: 16px;
      }
      .login-logo img {
        width: 60px;
        height: 60px;
      }
      .login-title {
        font-size: 1.5rem;
      }
      .login-subtitle {
        font-size: 0.9rem;
      }
      .form-group input {
        padding: 12px 14px;
        font-size: 16px;
      }
      .otp-digit {
        width: 40px;
        height: 48px;
        font-size: 1.2rem;
      }
    }
    
    /* Safe area for notched phones */
    @supports (padding: max(0px)) {
      .login-container {
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="auth-backdrop" aria-hidden="true"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><a href="/" title="PHINS"><img src="/phins-logo.svg" alt="PHINS emblem"></a></div>
        <h1 class="login-title">PHINS Portal</h1>
        <p class="login-subtitle">Sign in to access your account</p>
      </div>
      
      <!-- Step Indicator -->
      <div class="step-indicator" id="step-indicator">
        <div class="step active" id="step-1"></div>
        <div class="step" id="step-2"></div>
        <div class="step" id="step-3"></div>
      </div>
      
      <form id="login-form">
        <!-- Step 1: Credentials -->
        <div id="credentials-section">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus placeholder="Enter your username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password" />
          </div>
          
          <!-- CAPTCHA Section -->
          <div class="captcha-box" id="captcha-section">
            <div class="captcha-header">
              <label>Human Verification</label>
              <a href="#" class="captcha-refresh" id="captcha-refresh" title="Get a new challenge">&#x21bb;</a>
            </div>
            <div class="captcha-question" id="captcha-question">Loading...</div>
            <input type="text" class="captcha-input" id="captcha-answer" placeholder="Your answer" autocomplete="off" />
            <input type="hidden" id="captcha-id" />
          </div>
        </div>
        
        <!-- Step 2: OTP Verification (hidden by default) -->
        <div class="otp-box" id="otp-section">
          <div class="otp-header">
            <span>🔐</span>
            <h3>Verification Required</h3>
          </div>
          <p class="otp-info" id="otp-info">
            We've sent a verification code to your email <strong id="otp-email"></strong>
          </p>
          <div class="otp-input-group">
            <input type="text" class="otp-digit" maxlength="1" data-index="0" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="1" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="2" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="3" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="4" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="5" inputmode="numeric" />
          </div>
          <input type="hidden" id="verification-id" />
          <div class="otp-actions">
            <a class="otp-resend" id="resend-otp">Resend code (<span id="resend-timer">60</span>s)</a>
            <label class="trust-device">
              <input type="checkbox" id="trust-device" checked />
              Trust this device
            </label>
          </div>
        </div>
        
        <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
      </form>
      
      <div id="login-msg"></div>

      <div class="aux-links">
        <a href="/register.html">Don't have an account? Register</a>
        <span class="sep">•</span>
        <a href="/forgot-password.html">Forgot Password?</a>
      </div>
    </div>
  </div>
  
  <script src="/login.js"></script>
  <script>
    function normalizeHexColor(color, fallback) {
      if (typeof color !== 'string') return fallback;
      var trimmed = color.trim().toLowerCase();
      if (/^#[0-9a-f]{6}$/.test(trimmed)) return trimmed;
      if (/^#[0-9a-f]{3}$/.test(trimmed)) {
        return '#' + trimmed.slice(1).split('').map(function(char) { return char + char; }).join('');
      }
      return fallback;
    }

    (async function applyBranding() {
      try {
        var r = await fetch('/api/design/settings');
        if (!r.ok) return;
        var s = await r.json();
        var backdrop = document.querySelector('.auth-backdrop');
        var p = normalizeHexColor(s.primary_color, '#0d47a1');
        if (p && p !== '#0d47a1' && backdrop) {
          backdrop.style.background =
            'radial-gradient(1000px 600px at 80% -10%, ' + p + '8c, transparent 60%),' +
            'radial-gradient(800px 520px at 8% 110%, ' + p + '59, transparent 60%),' +
            '#060d1f';
        }
        if (s.hero_background_url && backdrop) {
          backdrop.style.backgroundImage = 'linear-gradient(rgba(4,9,22,0.78), rgba(4,9,22,0.86)), url(' + JSON.stringify(s.hero_background_url) + ')';
          backdrop.style.backgroundSize = 'cover';
          backdrop.style.backgroundPosition = 'center';
        }
      } catch (e) { /* branding optional */ }
    })();
  </script>
</body>
</html>
