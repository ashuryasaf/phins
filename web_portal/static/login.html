<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d47a1" />
  <title>PHINS Portal — Login</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #1976d2 100%);
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.5;
      pointer-events: none;
    }
    .login-container {
      width: 100%;
      max-width: 450px;
      padding: 16px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 52px;
      box-shadow: 0 16px 48px rgba(13, 71, 161, 0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-logo {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .login-title {
      color: #0d47a1;
      margin: 0 0 8px 0;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .login-subtitle {
      color: #546e7a;
      margin: 0;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 22px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #0d47a1;
      font-size: 0.95rem;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e3f2fd;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s;
      background: #fafcff;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1565c0;
      box-shadow: 0 0 0 4px rgba(21, 101, 192, 0.1);
      background: #fff;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1565c0 0%, #1976d2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(21, 101, 192, 0.3);
    }
    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(21, 101, 192, 0.4);
    }
    .btn-submit:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #1565c0;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .back-link:hover {
      color: #0d47a1;
    }
    #login-msg {
      margin-top: 16px;
      text-align: center;
      font-weight: 600;
    }
    
    /* CAPTCHA Styles */
    .captcha-box {
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      border: 2px solid #90caf9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .captcha-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .captcha-box label {
      color: #1565c0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .captcha-box label::before {
      content: '🛡️';
      font-size: 1.2rem;
    }
    .captcha-refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(21, 101, 192, 0.1);
      color: #1565c0;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .captcha-refresh:hover {
      background: rgba(21, 101, 192, 0.2);
      transform: rotate(90deg);
    }
    .captcha-question {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0d47a1;
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
      user-select: none;
      min-height: 1.4em;
    }
    .captcha-question.loading {
      color: #90a4ae;
      font-style: italic;
    }
    .captcha-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e3f2fd;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
      font-weight: 600;
    }
    .captcha-input:focus {
      border-color: #1565c0;
      outline: none;
    }
    
    /* OTP Verification Styles */
    .otp-box {
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
      border: 2px solid #ffb74d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
    }
    .otp-box.active {
      display: block;
    }
    .otp-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .otp-header span {
      font-size: 1.5rem;
    }
    .otp-header h3 {
      margin: 0;
      color: #e65100;
      font-size: 1.1rem;
    }
    .otp-info {
      font-size: 0.9rem;
      color: #bf360c;
      margin-bottom: 15px;
    }
    .otp-input-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 15px 0;
    }
    .otp-digit {
      width: 45px;
      height: 55px;
      border: 2px solid #ffb74d;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      background: #fff;
    }
    .otp-digit:focus {
      border-color: #e65100;
      outline: none;
      box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.2);
    }
    .otp-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }
    .otp-resend {
      color: #e65100;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .otp-resend:disabled, .otp-resend.disabled {
      color: #999;
      cursor: not-allowed;
    }
    .trust-device {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #666;
    }
    .trust-device input {
      width: auto;
    }
    
    /* Step Indicator */
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .step {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e0e0e0;
      transition: all 0.3s;
    }
    .step.active {
      background: #1565c0;
      width: 24px;
      border-radius: 5px;
    }
    .step.complete {
      background: #4caf50;
    }
    
    /* Mobile Responsive */
    @media screen and (max-width: 480px) {
      .login-container {
        padding: 12px;
      }
      .login-card {
        padding: 28px 20px;
        border-radius: 16px;
      }
      .login-logo {
        font-size: 2.5rem;
      }
      .login-title {
        font-size: 1.5rem;
      }
      .login-subtitle {
        font-size: 0.9rem;
      }
      .form-group input {
        padding: 12px 14px;
        font-size: 16px;
      }
      .otp-digit {
        width: 40px;
        height: 48px;
        font-size: 1.2rem;
      }
    }
    
    /* Safe area for notched phones */
    @supports (padding: max(0px)) {
      .login-container {
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🛡️</div>
        <h1 class="login-title">PHINS Portal</h1>
        <p class="login-subtitle">Sign in to access your account</p>
      </div>
      
      <!-- Step Indicator -->
      <div class="step-indicator" id="step-indicator">
        <div class="step active" id="step-1"></div>
        <div class="step" id="step-2"></div>
        <div class="step" id="step-3"></div>
      </div>
      
      <form id="login-form">
        <!-- Step 1: Credentials -->
        <div id="credentials-section">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus placeholder="Enter your username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password" />
          </div>
          
          <!-- CAPTCHA Section -->
          <div class="captcha-box" id="captcha-section">
            <div class="captcha-header">
              <label>Human Verification</label>
              <a href="#" class="captcha-refresh" id="captcha-refresh" title="Get a new challenge">&#x21bb;</a>
            </div>
            <div class="captcha-question" id="captcha-question">Loading...</div>
            <input type="text" class="captcha-input" id="captcha-answer" placeholder="Your answer" autocomplete="off" />
            <input type="hidden" id="captcha-id" />
          </div>
        </div>
        
        <!-- Step 2: OTP Verification (hidden by default) -->
        <div class="otp-box" id="otp-section">
          <div class="otp-header">
            <span>🔐</span>
            <h3>Verification Required</h3>
          </div>
          <p class="otp-info" id="otp-info">
            We've sent a verification code to your email <strong id="otp-email"></strong>
          </p>
          <div class="otp-input-group">
            <input type="text" class="otp-digit" maxlength="1" data-index="0" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="1" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="2" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="3" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="4" inputmode="numeric" />
            <input type="text" class="otp-digit" maxlength="1" data-index="5" inputmode="numeric" />
          </div>
          <input type="hidden" id="verification-id" />
          <div class="otp-actions">
            <a class="otp-resend" id="resend-otp">Resend code (<span id="resend-timer">60</span>s)</a>
            <label class="trust-device">
              <input type="checkbox" id="trust-device" checked />
              Trust this device
            </label>
          </div>
        </div>
        
        <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
      </form>
      
      <div id="login-msg"></div>

      <div style="margin-top: 20px; text-align: center;">
        <a href="/register.html" style="color: var(--brand); text-decoration: none; font-size: 0.9rem;">Don't have an account? Register</a>
        <span style="margin: 0 10px; color: var(--muted);">•</span>
        <a href="/forgot-password.html" style="color: var(--brand); text-decoration: none; font-size: 0.9rem;">Forgot Password?</a>
      </div>

      <a href="/" class="back-link">← Back to Home</a>
      <div style="margin-top: 16px; text-align: center; font-size: 0.8rem; color: #90a4ae;">
        <a href="/privacy-policy.html" style="color: #90a4ae; text-decoration: none;">Privacy Policy</a>
        <span style="margin: 0 6px;">&middot;</span>
        <a href="/terms-of-use.html" style="color: #90a4ae; text-decoration: none;">Terms of Use</a>
      </div>
    </div>
  </div>
  
  <script src="/login.js"></script>
  <script>
    function normalizeHexColor(color, fallback) {
      if (typeof color !== 'string') return fallback;
      var trimmed = color.trim().toLowerCase();
      if (/^#[0-9a-f]{6}$/.test(trimmed)) return trimmed;
      if (/^#[0-9a-f]{3}$/.test(trimmed)) {
        return '#' + trimmed.slice(1).split('').map(function(char) { return char + char; }).join('');
      }
      return fallback;
    }

    (async function applyBranding() {
      try {
        var r = await fetch('/api/design/settings');
        if (!r.ok) return;
        var s = await r.json();
        var p = normalizeHexColor(s.primary_color, '#0d47a1');
        if (p && p !== '#0d47a1') {
          document.body.style.background = 'linear-gradient(135deg, ' + p + ' 0%, ' + p + 'cc 50%, ' + p + 'dd 100%)';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', p);
        }
        if (s.hero_background_url) {
          document.body.style.backgroundImage = 'linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.65)), url(' + JSON.stringify(s.hero_background_url) + ')';
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
        }
      } catch (e) { /* branding optional */ }
    })();
  </script>
</body>
</html>
