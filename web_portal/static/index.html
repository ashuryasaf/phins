<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#060d1f" />
  <meta name="apple-mobile-web-app-title" content="PHINS" />
  <title>PHINS — Safe Assurance</title>
  <link rel="icon" type="image/svg+xml" href="/phins-logo.svg">
  <link rel="apple-touch-icon" href="/phins-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ds-primary: #0d47a1;
      --ds-accent: #e3bf6f;
      --ds-accent-strong: #f7e2a0;
      --ds-accent-shadow: rgba(227, 191, 111, 0.35);
      --ds-accent-shadow-hover: rgba(227, 191, 111, 0.5);
      --ink: #eaf1ff;
      --ink-dim: rgba(234, 241, 255, 0.62);
      --line: rgba(127, 178, 255, 0.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #060d1f;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Ambient backdrop ===== */
    .backdrop {
      position: fixed; inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1000px 600px at 80% -10%, rgba(21, 68, 155, 0.55), transparent 60%),
        radial-gradient(800px 520px at 8% 110%, rgba(11, 92, 130, 0.4), transparent 60%),
        radial-gradient(600px 400px at 50% 45%, rgba(30, 82, 170, 0.22), transparent 65%),
        #060d1f;
    }
    .backdrop::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(127, 178, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127, 178, 255, 0.05) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(900px 620px at 50% 40%, rgba(0,0,0,0.85), transparent 78%);
      -webkit-mask-image: radial-gradient(900px 620px at 50% 40%, rgba(0,0,0,0.85), transparent 78%);
    }
    .backdrop::after {
      content: '';
      position: absolute; inset: -30%;
      background: conic-gradient(from 180deg at 50% 50%,
        transparent 0deg, rgba(79, 216, 255, 0.05) 90deg,
        transparent 180deg, rgba(227, 191, 111, 0.04) 270deg, transparent 360deg);
      animation: slow-spin 60s linear infinite;
    }
    @keyframes slow-spin { to { transform: rotate(360deg); } }

    /* ===== Splash ===== */
    #splash-screen {
      position: fixed; inset: 0;
      background: #060d1f;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash-screen.hidden { opacity: 0; visibility: hidden; }
    .splash-logo {
      width: 110px; height: 110px;
      filter: drop-shadow(0 12px 44px rgba(79, 216, 255, 0.28));
      animation: pulse-logo 2.2s ease-in-out infinite;
    }
    .splash-logo img { width: 100%; height: 100%; display: block; }
    .splash-text {
      margin-top: 26px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.3rem; font-weight: 600; letter-spacing: 0.5em;
      padding-left: 0.5em;
    }
    .splash-tagline {
      margin-top: 10px; font-size: 0.8rem; letter-spacing: 0.42em; padding-left: 0.42em;
      color: var(--ds-accent);
      text-transform: uppercase;
    }
    @keyframes pulse-logo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    /* ===== Header ===== */
    .landing-header {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(6, 13, 31, 0.66);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      max-width: 1160px; margin: 0 auto;
      padding: 14px 28px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo {
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--ink);
    }
    .logo-icon { width: 42px; height: 42px; filter: drop-shadow(0 4px 16px rgba(79, 216, 255, 0.3)); }
    .logo-icon img { width: 100%; height: 100%; display: block; }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem; font-weight: 600; letter-spacing: 0.34em;
    }
    .btn-login {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 11px 28px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.92rem; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: #071022;
      background: linear-gradient(135deg, var(--ds-accent-strong) 0%, var(--ds-accent) 100%);
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(247, 226, 160, 0.35), 0 8px 28px var(--ds-accent-shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(247, 226, 160, 0.55), 0 14px 38px var(--ds-accent-shadow-hover);
    }

    /* ===== Hero ===== */
    .main-content {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .hero {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 140px 24px 80px;
      text-align: center;
    }
    .hero-content { max-width: 760px; }
    .hero-logo {
      width: 168px; height: 168px;
      margin: 0 auto 34px;
      filter: drop-shadow(0 24px 70px rgba(79, 216, 255, 0.32));
      animation: float 5s ease-in-out infinite;
    }
    .hero-logo img { width: 100%; height: 100%; display: block; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 9vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.32em; padding-left: 0.32em;
      background: linear-gradient(180deg, #ffffff 0%, #b7d3ff 70%, #7fa8e8 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero .tagline {
      margin-top: 18px;
      font-size: clamp(0.8rem, 2.4vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.5em; padding-left: 0.5em;
      text-transform: uppercase;
      color: var(--ds-accent);
    }
    .hero-divider {
      width: 120px; height: 1px;
      margin: 36px auto;
      background: linear-gradient(90deg, transparent, rgba(227, 191, 111, 0.7), transparent);
      position: relative;
    }
    .hero-divider::after {
      content: '';
      position: absolute; left: 50%; top: 50%;
      width: 5px; height: 5px;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--ds-accent);
      box-shadow: 0 0 12px var(--ds-accent);
    }
    .hero-cta {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 17px 54px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem; font-weight: 600; letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      background: rgba(127, 178, 255, 0.06);
      border: 1px solid rgba(127, 178, 255, 0.35);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .hero-cta::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.14) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.7s ease;
    }
    .hero-cta:hover { border-color: rgba(227, 191, 111, 0.75); box-shadow: 0 0 34px rgba(127, 178, 255, 0.22); transform: translateY(-2px); }
    .hero-cta:hover::before { transform: translateX(100%); }

    /* Entrance choreography */
    .rise { opacity: 0; transform: translateY(22px); animation: rise-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    .rise.d1 { animation-delay: 0.15s; }
    .rise.d2 { animation-delay: 0.3s; }
    .rise.d3 { animation-delay: 0.45s; }
    .rise.d4 { animation-delay: 0.6s; }
    @keyframes rise-in { to { opacity: 1; transform: translateY(0); } }

    /* ===== Footer ===== */
    .landing-footer {
      position: relative; z-index: 1;
      padding: 26px 24px;
      text-align: center;
      border-top: 1px solid var(--line);
    }
    .footer-copyright {
      color: var(--ink-dim);
      font-size: 0.82rem;
      letter-spacing: 0.18em;
    }

    @media (prefers-reduced-motion: reduce) {
      .backdrop::after, .splash-logo, .hero-logo, .rise { animation: none; }
      .rise { opacity: 1; transform: none; }
    }
    @media screen and (max-width: 600px) {
      .header-inner { padding: 12px 18px; }
      .logo-text { letter-spacing: 0.22em; font-size: 1.15rem; }
      .btn-login { padding: 9px 20px; font-size: 0.82rem; }
      .hero { padding: 120px 18px 60px; }
      .hero-logo { width: 128px; height: 128px; }
      .hero-cta { padding: 15px 40px; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo"><img src="/phins-logo.svg" alt="PHINS emblem"></div>
    <div class="splash-text">PHINS</div>
    <div class="splash-tagline">Safe Assurance</div>
  </div>

  <!-- Header -->
  <header class="landing-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <div class="logo-icon"><img src="/phins-logo.svg" alt="PHINS emblem"></div>
        <span class="logo-text">PHINS</span>
      </a>
      <nav class="nav-links">
        <a href="/login.html" class="btn-login">Login</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <section id="home" class="hero">
      <div class="hero-content">
        <div class="hero-logo rise"><img src="/phins-logo.svg" alt="PHINS emblem"></div>
        <h1 class="rise d1">PHINS</h1>
        <p class="tagline rise d2">Safe Assurance</p>
        <div class="hero-divider rise d3"></div>
        <a href="/login.html" class="hero-cta rise d4">Login</a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="landing-footer">
    <p class="footer-copyright">&copy; 2026 PHINS</p>
  </footer>

  <script>
    // Hide splash screen
    function hideSplashScreen() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 600);
      }
    }

    function normalizeHexColor(color, fallback) {
      if (typeof color !== 'string') return fallback;
      const trimmed = color.trim().toLowerCase();
      if (/^#[0-9a-f]{6}$/.test(trimmed)) return trimmed;
      if (/^#[0-9a-f]{3}$/.test(trimmed)) {
        return '#' + trimmed.slice(1).split('').map((char) => char + char).join('');
      }
      return fallback;
    }

    function mixHexColors(color, target, ratio) {
      const safeRatio = Math.max(0, Math.min(1, ratio));
      const parseHex = (hex) => [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16)
      ];
      const [r1, g1, b1] = parseHex(color);
      const [r2, g2, b2] = parseHex(target);
      const toHex = (value) => Math.round(value).toString(16).padStart(2, '0');

      return `#${toHex(r1 + (r2 - r1) * safeRatio)}${toHex(g1 + (g2 - g1) * safeRatio)}${toHex(b1 + (b2 - b1) * safeRatio)}`;
    }

    function applyDesignColors(settings) {
      const defaultPrimary = '#0d47a1';
      const defaultAccent = '#e3bf6f';
      // The platform's legacy accent default; treat it as "not customized"
      // so the landing page keeps its gold accent unless an admin picks a
      // deliberate brand color in the design settings.
      const legacyDefaultAccent = '#ff6b35';
      const primary = normalizeHexColor(settings.primary_color, defaultPrimary);
      let accent = normalizeHexColor(settings.accent_color, defaultAccent);
      if (accent === legacyDefaultAccent) accent = defaultAccent;
      const accentStrong =
        accent === defaultAccent ? '#f7e2a0' : mixHexColors(accent, '#ffffff', 0.18);
      const root = document.documentElement;
      root.style.setProperty('--ds-primary', primary);
      root.style.setProperty('--ds-accent', accent);
      root.style.setProperty('--ds-accent-strong', accentStrong);
      root.style.setProperty('--ds-accent-shadow', `${accent}59`);
      root.style.setProperty('--ds-accent-shadow-hover', `${accent}80`);

      if (primary !== defaultPrimary) {
        const glowSoft = mixHexColors(primary, '#000000', 0.35);
        const backdrop = document.querySelector('.backdrop');
        if (backdrop) {
          backdrop.style.background =
            `radial-gradient(1000px 600px at 80% -10%, ${glowSoft}8c, transparent 60%),` +
            `radial-gradient(800px 520px at 8% 110%, ${glowSoft}66, transparent 60%),` +
            `radial-gradient(600px 400px at 50% 45%, ${glowSoft}38, transparent 65%),` +
            '#060d1f';
        }
      }

      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.setAttribute('content', '#060d1f');
    }

    function applyHeroBackground(url) {
      if (!url) return;
      const hero = document.querySelector('.hero');
      if (!hero) return;
      hero.style.backgroundImage = `linear-gradient(rgba(4,9,22,0.72), rgba(4,9,22,0.82)), url(${JSON.stringify(url)})`;
      hero.style.backgroundSize = 'cover';
      hero.style.backgroundPosition = 'center';
    }

    function applyPromoBanner(url) {
      if (!url) return;
      var existing = document.getElementById('promo-banner');
      if (existing) { existing.style.display = 'block'; }
      else {
        var banner = document.createElement('div');
        banner.id = 'promo-banner';
        banner.style.cssText = 'position:relative;z-index:1;width:100%;text-align:center;padding:0;background:rgba(255,255,255,0.04);border-top:1px solid rgba(127,178,255,0.16);';
        var img = document.createElement('img');
        img.src = url;
        img.alt = 'Promotion';
        img.style.cssText = 'max-width:100%;max-height:200px;object-fit:contain;display:block;margin:0 auto;';
        img.onerror = function() { banner.style.display = 'none'; };
        banner.appendChild(img);
        var mainContent = document.querySelector('.main-content');
        var heroSection = document.getElementById('home');
        if (mainContent && heroSection) {
          mainContent.insertBefore(banner, heroSection.nextSibling);
        }
      }
    }

    function applySectionVisibility(settings) {
      var videoSection = document.getElementById('video');
      if (videoSection) {
        videoSection.style.display = settings.show_video === false ? 'none' : '';
      }
      var contactSection = document.getElementById('contact');
      if (contactSection) {
        contactSection.style.display = settings.show_contact === false ? 'none' : '';
      }
    }

    async function loadDesignSettings() {
      try {
        const response = await fetch('/api/design/settings');
        if (response.ok) {
          const settings = await response.json();

          applyDesignColors(settings);
          applySectionVisibility(settings);

          if (settings.hero_background_url) {
            applyHeroBackground(settings.hero_background_url);
          }

          if (settings.promo_banner_url) {
            applyPromoBanner(settings.promo_banner_url);
          }
        }
      } catch (err) {
        console.log('Design settings not configured yet');
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', function() {
      // Hide splash after 1.2s
      setTimeout(hideSplashScreen, 1200);

      // Load admin-managed design settings
      loadDesignSettings();
    });

    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  </script>
</body>
</html>
