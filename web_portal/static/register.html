<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHINS Portal — Register</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #1976d2 100%);
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.5;
      pointer-events: none;
    }
    .register-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      position: relative;
      z-index: 1;
    }
    .register-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px;
      box-shadow: 0 16px 48px rgba(13, 71, 161, 0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .register-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .register-logo {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .register-title {
      color: #0d47a1;
      margin: 0 0 8px 0;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .register-subtitle {
      color: #546e7a;
      margin: 0;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #0d47a1;
      font-size: 0.95rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e3f2fd;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s;
      background: #fafcff;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #1565c0;
      box-shadow: 0 0 0 4px rgba(21, 101, 192, 0.1);
      background: #fff;
    }
    .form-group small {
      display: block;
      margin-top: 4px;
      color: #546e7a;
      font-size: 0.85rem;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1565c0 0%, #1976d2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(21, 101, 192, 0.3);
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(21, 101, 192, 0.4);
    }
    .btn-submit:disabled {
      background: #546e7a;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #1565c0;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .back-link:hover {
      color: #0d47a1;
    }
    #register-msg {
      margin-top: 16px;
      text-align: center;
      font-weight: 600;
    }
    .password-strength {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s, background 0.3s;
    }
    .password-requirements {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .requirement {
      margin: 4px 0;
    }
    .requirement.met {
      color: #28a745;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <div class="register-logo">🛡️</div>
        <h1 class="register-title">Create Account</h1>
        <p class="register-subtitle">By Invitation Only</p>
      </div>
      
      <form id="register-form">
        <!-- Invitation Code (Required) -->
        <div class="form-group" style="background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%); padding: 16px; border-radius: 12px; margin-bottom: 24px; border: 2px solid #ffc107;">
          <label for="invitation-code" style="color: #856404; display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.3rem;">🎟️</span> Invitation Code *
          </label>
          <input type="text" id="invitation-code" name="invitation_code" required 
                 placeholder="Enter your invitation code (e.g., PHINS-2026-XXXX)"
                 style="text-transform: uppercase; font-family: monospace; font-size: 1.1rem; letter-spacing: 1px;" />
          <small style="color: #856404;">Registration is by invitation only. Please enter the code you received.</small>
          <div id="code-validation" style="margin-top: 8px; font-weight: 600;"></div>
        </div>

        <div class="form-group">
          <label for="full-name">Full Name *</label>
          <input type="text" id="full-name" name="full_name" required placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email" />
          <small>This will be your username</small>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" />
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" />
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" required placeholder="Create a strong password" />
          <div class="password-strength">
            <div class="password-strength-bar" id="strength-bar"></div>
          </div>
          <div class="password-requirements">
            <div class="requirement" id="req-length">✗ At least 8 characters</div>
            <div class="requirement" id="req-uppercase">✗ One uppercase letter</div>
            <div class="requirement" id="req-lowercase">✗ One lowercase letter</div>
            <div class="requirement" id="req-number">✗ One number</div>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password *</label>
          <input type="password" id="confirm-password" name="confirm_password" required placeholder="Re-enter your password" />
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Create Account</button>
      </form>
      
      <div id="register-msg"></div>

      <div style="margin-top: 20px; text-align: center;">
        <a href="/login.html" style="color: var(--brand); text-decoration: none; font-size: 0.9rem;">Already have an account? Sign In</a>
      </div>

      <a href="/" class="back-link">← Back to Home</a>
    </div>
  </div>
  
  <script src="/register.js"></script>
</body>
</html>
