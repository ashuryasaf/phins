<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Terminal | PHINS</title>
    <style>
        :root { --bg:#0a0e17; --panel:#111827; --border:#1f2937; --text:#e5e7eb; --muted:#6b7280; --gold:#fbbf24; --green:#10b981; --red:#ef4444; --blue:#3b82f6; --purple:#8b5cf6; }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'SF Mono','Fira Code','Consolas',monospace;background:var(--bg);color:var(--text);font-size:12px;overflow:hidden;height:100vh;}

        .terminal-header{background:#000;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);height:32px;}
        .terminal-header .brand{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:1px;}
        .terminal-header .status{display:flex;gap:12px;align-items:center;font-size:11px;}
        .status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;}
        .status-dot.on{background:var(--green);box-shadow:0 0 4px var(--green);}
        .status-dot.off{background:var(--red);}
        .hdr-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:3px;cursor:pointer;font-size:10px;font-family:inherit;}
        .hdr-btn:hover{border-color:var(--gold);color:var(--gold);}

        .ticker-bar{background:#000;padding:3px 0;overflow:hidden;border-bottom:1px solid #1a1a2e;height:22px;}
        .ticker-scroll{display:flex;gap:24px;animation:scroll 60s linear infinite;white-space:nowrap;padding:0 12px;font-size:11px;}
        @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        .tick-up{color:var(--green);} .tick-down{color:var(--red);} .tick-flat{color:var(--muted);}

        .terminal-grid{display:grid;grid-template-columns:280px 1fr 320px;grid-template-rows:1fr 260px;height:calc(100vh - 54px);gap:1px;background:var(--border);}
        @media(max-width:1200px){.terminal-grid{grid-template-columns:1fr 1fr;}}
        @media(max-width:768px){.terminal-grid{grid-template-columns:1fr;grid-template-rows:auto;overflow-y:auto;height:auto;}}

        .panel{background:var(--panel);padding:8px;overflow-y:auto;}
        .panel-title{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);}

        .acct-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
        .acct-label{color:var(--muted);} .acct-val{font-weight:600;} .acct-val.up{color:var(--green);} .acct-val.down{color:var(--red);}

        .pos-row{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer;}
        .pos-row:hover{background:rgba(251,191,36,0.05);}
        .pos-sym{color:var(--gold);font-weight:700;width:55px;}
        .pos-qty{color:var(--muted);width:40px;text-align:right;}
        .pos-price{width:60px;text-align:right;}
        .pos-pl{width:70px;text-align:right;font-weight:600;}
        .pos-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:1px 6px;border-radius:2px;cursor:pointer;font-size:10px;font-family:inherit;}
        .pos-btn:hover{border-color:var(--red);color:var(--red);}

        .chart-panel{position:relative;}
        .chart-panel canvas{width:100%;height:100%;display:block;}
        .chart-controls{position:absolute;top:8px;left:8px;display:flex;gap:4px;z-index:10;}
        .chart-tf{background:rgba(0,0,0,0.7);border:1px solid var(--border);color:var(--muted);padding:2px 8px;cursor:pointer;font-size:10px;font-family:inherit;border-radius:2px;}
        .chart-tf.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700;}
        .chart-symbol{position:absolute;top:8px;right:8px;z-index:10;}
        .chart-symbol input{background:rgba(0,0,0,0.8);border:1px solid var(--border);color:var(--gold);padding:3px 8px;width:100px;font-family:inherit;font-size:11px;border-radius:2px;text-transform:uppercase;}

        .copilot-panel{grid-column:3;grid-row:1/3;}
        @media(max-width:1200px){.copilot-panel{grid-column:auto;grid-row:auto;}}

        .copilot-input{display:flex;gap:4px;margin-bottom:8px;}
        .copilot-input input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-family:inherit;font-size:11px;border-radius:3px;}
        .copilot-btn{background:var(--gold);color:#000;border:none;padding:5px 12px;font-weight:700;cursor:pointer;font-family:inherit;font-size:11px;border-radius:3px;}

        .copilot-card{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px;margin-bottom:6px;}
        .copilot-rec{text-align:center;padding:8px;font-size:16px;font-weight:700;border-radius:4px;margin-bottom:6px;}
        .copilot-rec.buy{background:rgba(16,185,129,0.15);color:var(--green);border:1px solid var(--green);}
        .copilot-rec.sell{background:rgba(239,68,68,0.15);color:var(--red);border:1px solid var(--red);}
        .copilot-rec.hold{background:rgba(251,191,36,0.15);color:var(--gold);border:1px solid var(--gold);}

        .order-form{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px;margin-bottom:6px;}
        .order-row{display:flex;gap:4px;margin-bottom:4px;align-items:center;}
        .order-row label{color:var(--muted);width:50px;font-size:10px;}
        .order-row input,.order-row select{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:4px 6px;font-family:inherit;font-size:11px;border-radius:2px;}
        .btn-exec-buy{background:var(--green);color:#000;border:none;padding:6px;font-weight:700;cursor:pointer;flex:1;font-family:inherit;border-radius:3px;}
        .btn-exec-sell{background:var(--red);color:#fff;border:none;padding:6px;font-weight:700;cursor:pointer;flex:1;font-family:inherit;border-radius:3px;}

        .order-row-item{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px;}
        .signal-item{padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px;}
        .signal-bull{color:var(--green);} .signal-bear{color:var(--red);} .signal-neut{color:var(--muted);}

        .nav-links{display:flex;gap:8px;} .nav-links a{color:var(--muted);text-decoration:none;font-size:10px;} .nav-links a:hover{color:var(--gold);}
    </style>
</head>
<body>

<div class="terminal-header">
    <div style="display:flex;align-items:center;gap:16px;">
        <span class="brand">PHINS TERMINAL</span>
        <div class="nav-links">
            <a href="/investment-ai.html">AI Tool</a>
            <a href="/algo-trading.html">Algo</a>
            <a href="/savings-portfolio.html">Portfolio</a>
            <a href="/dashboard.html">Dashboard</a>
        </div>
    </div>
    <div class="status">
        <span><span class="status-dot" id="brokerDot"></span><span id="brokerStatus">Connecting...</span></span>
        <span><span class="status-dot" id="dataDot"></span><span id="dataStatus">Data</span></span>
        <span id="clock" style="color:var(--gold);"></span>
        <button class="hdr-btn" id="keyBtn" onclick="promptKey()">KEY</button>
    </div>
</div>

<div class="ticker-bar">
    <div class="ticker-scroll" id="globalTicker">Loading market data...</div>
</div>

<div class="terminal-grid">
    <!-- LEFT: Account + Positions -->
    <div class="panel" style="grid-row:1/3;">
        <div class="panel-title">Account</div>
        <div id="accountPanel">Loading...</div>
        <div class="panel-title" style="margin-top:10px;">Positions</div>
        <div id="positionsPanel">Loading...</div>
        <div class="panel-title" style="margin-top:10px;">Recent Orders</div>
        <div id="ordersPanel">Loading...</div>
    </div>

    <!-- CENTER: Chart -->
    <div class="panel chart-panel" id="chartPanel">
        <div class="chart-controls" id="chartControls">
            <button class="chart-tf active" onclick="setChartTF('1D')">1D</button>
            <button class="chart-tf" onclick="setChartTF('1W')">1W</button>
            <button class="chart-tf" onclick="setChartTF('1M')">1M</button>
            <button class="chart-tf" onclick="setChartTF('3M')">3M</button>
            <button class="chart-tf" onclick="setChartTF('1Y')">1Y</button>
        </div>
        <div class="chart-symbol">
            <input type="text" id="chartSymbol" value="SPY" onkeydown="if(event.key==='Enter')loadChart()">
        </div>
        <canvas id="terminalChart"></canvas>
    </div>

    <!-- RIGHT: AI Copilot -->
    <div class="panel copilot-panel">
        <div class="panel-title">AI Copilot</div>
        <div class="copilot-input">
            <input type="text" id="copilotSymbol" placeholder="Symbol..." value="AAPL" onkeydown="if(event.key==='Enter')runCopilot()">
            <button class="copilot-btn" onclick="runCopilot()">ANALYZE</button>
        </div>
        <div id="copilotResult">
            <div class="copilot-card" style="text-align:center;color:var(--muted);padding:20px;">
                Enter a symbol and click ANALYZE for AI-powered trade analysis
            </div>
        </div>

        <div class="panel-title" style="margin-top:8px;">Quick Order</div>
        <div class="order-form">
            <div class="order-row"><label>Symbol</label><input type="text" id="orderSymbol" value="AAPL" style="text-transform:uppercase;"></div>
            <div class="order-row"><label>Qty</label><input type="number" id="orderQty" value="1" min="1"></div>
            <div class="order-row"><label>Type</label><select id="orderType"><option value="market">Market</option><option value="limit">Limit</option><option value="stop">Stop</option><option value="trailing_stop">Trailing Stop</option></select></div>
            <div class="order-row" id="limitRow" style="display:none;"><label>Price</label><input type="number" id="orderPrice" step="0.01" placeholder="Limit price"></div>
            <div class="order-row" style="gap:6px;margin-top:6px;">
                <button class="btn-exec-buy" onclick="executeOrder('buy')">BUY</button>
                <button class="btn-exec-sell" onclick="executeOrder('sell')">SELL</button>
            </div>
        </div>
        <div id="orderResult"></div>
    </div>

    <!-- BOTTOM: Global Dashboard -->
    <div class="panel" style="grid-column:1/3;">
        <div class="panel-title">Global Markets</div>
        <div id="globalPanel" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px;">Loading...</div>
    </div>
</div>

<script>
let apiKey = localStorage.getItem('investmentAiKey') || '';
let chartTF = '1M';
let chartSym = 'SPY';
let refreshInterval = null;

document.getElementById('orderType').addEventListener('change', function() {
    document.getElementById('limitRow').style.display = ['limit','stop'].includes(this.value) ? 'flex' : 'none';
});

function promptKey() {
    const k = prompt('Enter Investment AI Access Key:', apiKey);
    if (k) { apiKey = k; localStorage.setItem('investmentAiKey', k); initTerminal(); }
}

async function apiFetch(path) {
    const res = await fetch(path + (path.includes('?') ? '&' : '?') + 'api_key=' + encodeURIComponent(apiKey), {
        headers: { 'X-Investment-AI-Key': apiKey }
    });
    return await res.json();
}

async function apiPost(path, body) {
    const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Investment-AI-Key': apiKey },
        body: JSON.stringify({ ...body, api_key: apiKey }),
    });
    return await res.json();
}

function $(id) { return document.getElementById(id); }
function fmt(n) { return n != null ? Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : '—'; }
function plClass(n) { return n > 0 ? 'up' : (n < 0 ? 'down' : ''); }

function updateClock() {
    const now = new Date();
    $('clock').textContent = now.toUTCString().slice(17,25) + ' UTC';
}
setInterval(updateClock, 1000);
updateClock();

async function initTerminal() {
    if (!apiKey) { promptKey(); return; }
    loadAccount();
    loadPositions();
    loadOrders();
    loadGlobalDashboard();
    loadChart();
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => { loadAccount(); loadPositions(); }, 30000);
}

async function loadAccount() {
    try {
        const d = await apiFetch('/api/terminal/account');
        if (d.error) { $('accountPanel').innerHTML = `<div style="color:var(--red)">${d.error}</div>`; return; }
        const dot = $('brokerDot');
        const st = $('brokerStatus');
        dot.className = 'status-dot ' + (d.connected ? 'on' : 'off');
        st.textContent = d.connected ? (d.paper ? 'Paper' : 'Live') : 'Demo';
        $('dataDot').className = 'status-dot on';
        $('dataStatus').textContent = 'AV';
        let html = '';
        html += acctRow('Portfolio', '$' + fmt(d.portfolio_value));
        html += acctRow('Equity', '$' + fmt(d.equity));
        html += acctRow('Cash', '$' + fmt(d.cash));
        html += acctRow('Buying Power', '$' + fmt(d.buying_power), 'up');
        html += acctRow('Day P&L', '$' + fmt(d.unrealized_pl), plClass(d.unrealized_pl));
        html += acctRow('Day P&L %', (d.unrealized_pl_pct ? (d.unrealized_pl_pct*100).toFixed(2)+'%' : '—'), plClass(d.unrealized_pl_pct));
        $('accountPanel').innerHTML = html;
    } catch(e) { $('accountPanel').innerHTML = '<div style="color:var(--red)">Connection error</div>'; }
}

function acctRow(label, val, cls) {
    return `<div class="acct-row"><span class="acct-label">${label}</span><span class="acct-val ${cls||''}">${val}</span></div>`;
}

async function loadPositions() {
    try {
        const d = await apiFetch('/api/terminal/positions');
        if (!Array.isArray(d) || d.length === 0) { $('positionsPanel').innerHTML = '<div style="color:var(--muted)">No positions</div>'; return; }
        let html = '';
        d.forEach(p => {
            const plVal = p.unrealized_pl || 0;
            const plPct = p.unrealized_pl_pct ? (p.unrealized_pl_pct*100).toFixed(1)+'%' : '';
            const cls = plClass(plVal);
            html += `<div class="pos-row" onclick="analyzeFromPos('${p.symbol}')">
                <span class="pos-sym">${p.symbol}</span>
                <span class="pos-qty">${p.qty}</span>
                <span class="pos-price">$${fmt(p.current_price)}</span>
                <span class="pos-pl ${cls}">$${fmt(plVal)} ${plPct}</span>
                <button class="pos-btn" onclick="event.stopPropagation();closePos('${p.symbol}')">X</button>
            </div>`;
        });
        $('positionsPanel').innerHTML = html;
    } catch(e) { $('positionsPanel').innerHTML = '<div style="color:var(--red)">Error</div>'; }
}

async function loadOrders() {
    try {
        const d = await apiFetch('/api/terminal/orders');
        if (!Array.isArray(d) || d.length === 0) { $('ordersPanel').innerHTML = '<div style="color:var(--muted)">No recent orders</div>'; return; }
        let html = '';
        d.slice(0,8).forEach(o => {
            const sideColor = o.side === 'buy' ? 'var(--green)' : 'var(--red)';
            html += `<div class="order-row-item"><span style="color:${sideColor};font-weight:700;">${o.side?.toUpperCase()}</span><span style="color:var(--gold);">${o.symbol}</span><span>${o.qty||o.notional||''}</span><span style="color:var(--muted);">${o.status}</span></div>`;
        });
        $('ordersPanel').innerHTML = html;
    } catch(e) {}
}

async function loadGlobalDashboard() {
    try {
        const d = await apiFetch('/api/terminal/dashboard');
        if (!d.dashboard) return;
        let html = '';
        const categories = [
            ['Indices', d.dashboard.indices],
            ['Crypto', d.dashboard.crypto],
            ['Commodities', d.dashboard.commodities],
            ['Bonds', d.dashboard.bonds],
        ];
        categories.forEach(([cat, items]) => {
            if (!items) return;
            html += `<div style="grid-column:1/-1;color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:4px;">${cat}</div>`;
            items.forEach(item => {
                const chg = parseFloat(item.change_pct || 0);
                const cls = chg > 0 ? 'tick-up' : (chg < 0 ? 'tick-down' : 'tick-flat');
                html += `<div style="background:var(--bg);padding:6px 8px;border-radius:3px;border:1px solid var(--border);cursor:pointer;" onclick="chartSym='${item.symbol.replace('/USD','')}';$('chartSymbol').value=chartSym;loadChart();">
                    <div style="color:var(--muted);font-size:10px;">${item.name}</div>
                    <div style="font-weight:700;">${item.price ? '$'+fmt(item.price) : '—'}</div>
                    <div class="${cls}" style="font-size:10px;">${chg ? (chg>0?'+':'')+chg+'%' : ''}</div>
                </div>`;
            });
        });
        $('globalPanel').innerHTML = html;

        // Ticker bar
        let tickerHtml = '';
        for (const [, items] of Object.entries(d.dashboard)) {
            if (!items) continue;
            items.forEach(item => {
                const chg = parseFloat(item.change_pct || 0);
                const cls = chg > 0 ? 'tick-up' : (chg < 0 ? 'tick-down' : 'tick-flat');
                tickerHtml += `<span><span style="color:var(--gold);font-weight:700;">${item.symbol}</span> ${item.price?'$'+Number(item.price).toFixed(2):''} <span class="${cls}">${chg?(chg>0?'+':'')+chg+'%':''}</span></span>`;
            });
        }
        $('globalTicker').innerHTML = tickerHtml + tickerHtml;
    } catch(e) {}
}

async function loadChart() {
    chartSym = $('chartSymbol').value.toUpperCase() || 'SPY';
    try {
        const d = await apiPost('/api/investment-ai/analyze', { module: 'deep_dive', params: { symbol: chartSym, timeframe: chartTF } });
        const bars = (d.chart_data || {}).bars || [];
        drawTerminalChart(bars, chartSym, d);
    } catch(e) {}
}

function setChartTF(tf) {
    chartTF = tf;
    document.querySelectorAll('.chart-tf').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    loadChart();
}

function drawTerminalChart(bars, symbol, data) {
    const canvas = $('terminalChart');
    const parent = canvas.parentElement;
    const W = canvas.width = parent.clientWidth;
    const H = canvas.height = parent.clientHeight - 10;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    if (!bars.length) { ctx.fillStyle = 'var(--muted)'; ctx.font = '14px monospace'; ctx.fillText('No chart data', W/2-40, H/2); return; }

    const closes = bars.map(b => b.close || 0).reverse();
    const highs = bars.map(b => b.high || b.close || 0).reverse();
    const lows = bars.map(b => b.low || b.close || 0).reverse();
    const min = Math.min(...lows) * 0.998;
    const max = Math.max(...highs) * 1.002;
    const range = max - min || 1;
    const stepX = W / (closes.length - 1 || 1);
    const padT = 40; const padB = 20;
    const chartH = H - padT - padB;

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i <= 6; i++) { const y = padT + (chartH/6)*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // Price labels
    ctx.fillStyle = '#4b5563'; ctx.font = '10px monospace';
    for (let i = 0; i <= 4; i++) {
        const v = max - (range/4)*i;
        const y = padT + (chartH/4)*i;
        ctx.fillText('$'+v.toFixed(2), 4, y - 2);
    }

    // Area fill
    const isUp = closes[closes.length-1] >= closes[0];
    const grad = ctx.createLinearGradient(0, padT, 0, H);
    grad.addColorStop(0, isUp ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    closes.forEach((c,i) => { const x=i*stepX; const y=padT+((max-c)/range)*chartH; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.lineTo((closes.length-1)*stepX, H-padB); ctx.lineTo(0, H-padB); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    // Line
    ctx.beginPath();
    closes.forEach((c,i) => { const x=i*stepX; const y=padT+((max-c)/range)*chartH; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.strokeStyle = isUp ? '#10b981' : '#ef4444';
    ctx.lineWidth = 1.5; ctx.stroke();

    // Symbol + price label
    const latest = closes[closes.length-1];
    const change = ((latest - closes[0]) / closes[0] * 100).toFixed(2);
    ctx.fillStyle = isUp ? '#10b981' : '#ef4444';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(symbol + '  $' + latest.toFixed(2) + '  ' + (isUp?'+':'') + change + '%', 12, 24);

    // Recommendation badge
    const rec = (data.signals || {}).recommendation || '';
    if (rec) {
        const recColor = rec.includes('BUY') ? '#10b981' : (rec.includes('SELL') ? '#ef4444' : '#fbbf24');
        ctx.fillStyle = recColor; ctx.font = 'bold 11px monospace';
        ctx.fillText('AI: ' + rec, W - 140, 24);
    }
}

async function runCopilot() {
    const sym = $('copilotSymbol').value.toUpperCase();
    if (!sym) return;
    $('copilotResult').innerHTML = '<div class="copilot-card" style="text-align:center;color:var(--muted);">Analyzing...</div>';
    $('orderSymbol').value = sym;
    chartSym = sym; $('chartSymbol').value = sym; loadChart();

    try {
        const d = await apiFetch('/api/terminal/copilot?symbol=' + sym);
        if (d.error) { $('copilotResult').innerHTML = `<div class="copilot-card" style="color:var(--red);">${d.error}</div>`; return; }
        let html = '';
        const rec = d.ai_recommendation || 'HOLD';
        const recCls = rec.includes('BUY') ? 'buy' : (rec.includes('SELL') ? 'sell' : 'hold');
        html += `<div class="copilot-rec ${recCls}">${rec}</div>`;
        html += `<div class="copilot-card"><div style="color:var(--gold);font-size:10px;margin-bottom:4px;">PRICE & ACTION</div>`;
        html += `<div style="font-size:16px;font-weight:700;">$${fmt(d.price)}</div>`;
        html += `<div style="color:var(--muted);margin-top:2px;">Score: ${d.composite_score} | Action: <span style="color:var(--gold);">${d.copilot_action}</span></div></div>`;

        if (d.trade_suggestion) {
            const ts = d.trade_suggestion;
            html += `<div class="copilot-card"><div style="color:var(--gold);font-size:10px;margin-bottom:4px;">TRADE SUGGESTION</div>`;
            html += `<div>Qty: <strong>${ts.qty}</strong> | Value: $${fmt(ts.max_value)} | Risk: ${ts.risk_pct}</div>`;
            html += `<div style="color:var(--green);">TP: $${ts.take_profit}</div>`;
            html += `<div style="color:var(--red);">SL: $${ts.stop_loss}</div></div>`;
            $('orderQty').value = ts.qty || 1;
        }

        if (d.signal_details && d.signal_details.length) {
            html += `<div class="copilot-card"><div style="color:var(--gold);font-size:10px;margin-bottom:4px;">SIGNALS</div>`;
            d.signal_details.forEach(s => {
                const cls = s.bias === 'bullish' || s.bias === 'mildly_bullish' ? 'signal-bull' : (s.bias === 'bearish' || s.bias === 'mildly_bearish' ? 'signal-bear' : 'signal-neut');
                html += `<div class="signal-item ${cls}">${s.signal} ${s.value !== undefined ? '('+s.value+')' : ''}</div>`;
            });
            html += '</div>';
        }

        if (d.news_sentiment && d.news_sentiment.articles) {
            html += `<div class="copilot-card"><div style="color:var(--gold);font-size:10px;margin-bottom:4px;">NEWS (${d.news_sentiment.label})</div>`;
            d.news_sentiment.articles.forEach(a => {
                html += `<div style="padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03);"><a href="${a.url||'#'}" target="_blank" style="color:var(--text);text-decoration:none;font-size:11px;">${a.title||''}</a></div>`;
            });
            html += '</div>';
        }

        if (d.current_position) {
            const cp = d.current_position;
            html += `<div class="copilot-card"><div style="color:var(--gold);font-size:10px;margin-bottom:4px;">YOUR POSITION</div>`;
            html += `<div>${cp.qty} shares @ $${fmt(cp.avg_entry_price)}</div>`;
            html += `<div class="${plClass(cp.unrealized_pl)}">P&L: $${fmt(cp.unrealized_pl)} (${cp.unrealized_pl_pct?(cp.unrealized_pl_pct*100).toFixed(1)+'%':''})</div></div>`;
        }

        $('copilotResult').innerHTML = html;
    } catch(e) { $('copilotResult').innerHTML = `<div class="copilot-card" style="color:var(--red);">Error: ${e.message}</div>`; }
}

async function executeOrder(side) {
    const symbol = $('orderSymbol').value.toUpperCase();
    const qty = parseFloat($('orderQty').value);
    const type = $('orderType').value;
    const limitPrice = type === 'limit' ? parseFloat($('orderPrice').value) : undefined;
    const stopPrice = type === 'stop' ? parseFloat($('orderPrice').value) : undefined;

    if (!symbol || !qty) { alert('Symbol and qty required'); return; }

    const body = { symbol, side, qty, order_type: type, time_in_force: 'day' };
    if (limitPrice) body.limit_price = limitPrice;
    if (stopPrice) body.stop_price = stopPrice;

    try {
        const d = await apiPost('/api/terminal/order', body);
        if (d.error) { $('orderResult').innerHTML = `<div style="color:var(--red);padding:4px;">${JSON.stringify(d.error)}</div>`; return; }
        $('orderResult').innerHTML = `<div style="color:var(--green);padding:4px;">Order ${d.status}: ${d.side?.toUpperCase()} ${d.qty||''} ${d.symbol} (${d.broker||''})</div>`;
        setTimeout(() => { loadPositions(); loadOrders(); loadAccount(); }, 1000);
    } catch(e) { $('orderResult').innerHTML = `<div style="color:var(--red);padding:4px;">${e.message}</div>`; }
}

async function closePos(symbol) {
    if (!confirm('Close entire ' + symbol + ' position?')) return;
    try {
        await apiPost('/api/terminal/close-position', { symbol });
        loadPositions(); loadOrders(); loadAccount();
    } catch(e) {}
}

function analyzeFromPos(symbol) {
    $('copilotSymbol').value = symbol;
    runCopilot();
}

if (apiKey) initTerminal();
else promptKey();
</script>
</body>
</html>
