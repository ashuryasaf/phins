services:
  - type: web
    name: phins-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 web_portal/server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 8000
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "true"
  - type: cron
    name: phins-monthly-auto-pay
    env: python
    schedule: "0 0 1 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 scripts/run_monthly_auto_pay.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
