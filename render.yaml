services:
  - type: web
    name: phins-portal
    env: python
    buildCommand: pip install -r requirements.txt && chmod +x scripts/entrypoint.sh
    startCommand: ./scripts/entrypoint.sh serve
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 8000
      # U1: RENDER implies production in security.boot_integrity; durable DB
      # is required unless PHINS_REQUIRE_DATABASE is explicitly false.
      - key: PHINS_ENVIRONMENT
        value: production
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "true"
  - type: cron
    name: phins-monthly-auto-pay
    env: python
    schedule: "15 6 * * *"
    buildCommand: pip install -r requirements.txt && chmod +x scripts/entrypoint.sh
    startCommand: ./scripts/entrypoint.sh cron
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
