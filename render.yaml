services:
  - type: web
    name: phins-portal
    env: python
    buildCommand: pip install -r requirements.txt && chmod +x scripts/entrypoint.sh
    startCommand: ./scripts/entrypoint.sh serve
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 8000
      # U1: bare RENDER is already treated as production by
      # security.boot_integrity / secrets_policy; durable DB is required
      # unless PHINS_REQUIRE_DATABASE is explicitly false. Do not set
      # PHINS_ENVIRONMENT=production here — that would broaden production
      # semantics beyond the HTTP serve gate.
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        value: "true"
  - type: cron
    name: phins-monthly-auto-pay
    env: python
    schedule: "15 6 * * *"
    buildCommand: pip install -r requirements.txt && chmod +x scripts/entrypoint.sh
    startCommand: ./scripts/entrypoint.sh cron
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # U1: bare RENDER makes database_required() true. Link the same
      # Postgres as the web service (DATABASE_URL) so auto-pay does not
      # exit at the CLI durability gate. Do not set
      # PHINS_REQUIRE_DATABASE=false here — that would charge empty books.
