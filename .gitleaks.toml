title = "PHINS Gitleaks configuration"

# Extends the bundled default ruleset. Our additions below are allowlists for
# false positives the generic "token" / "api-key" regexes produce on the PHINS
# source tree. We do NOT weaken the secret-detection rules themselves; we only
# mark known-safe lines so the Security Scan workflow stops failing on
# identifier names like ``token_jti`` that are not credentials.
[extend]
useDefault = true

# Global allowlist (legacy single-object form; retained for compatibility with
# the default config which uses ``[allowlist]`` rather than ``[[allowlists]]``).
[allowlist]
description = "PHINS global allowlist"
paths = [
    '''^tests/''',
    '''^docs/''',
    '''(^|/)CYBERSECURITY\.md$''',
    '''(^|/)SECURITY[_A-Z]*\.md$''',
    '''^database/(dynamic_customers|invitation_codes)\.json$''',
    '''^backups/''',
    '''^\.gitleaks\.toml$''',
]

# ``regexTarget = "line"`` evaluates the regex against the full source line
# instead of only the extracted secret. This lets us suppress identifier
# names (``token_jti``, ``_v2_claims.jti``, ``token_version``) where the
# generic-api-key heuristic treats the RHS attribute access as if it were a
# credential. The actual bearer tokens are generated at runtime in
# ``security.auth_tokens.create_token`` and never appear in source.
regexTarget = "line"
regexes = [
    '''\btoken_jti\s*[:=]\s*(?:_v2_claims\.jti|None|claims\.jti|token_urlsafe\()''',
    '''\btoken,\s*_?token_jti\s*=''',
    '''\btoken_version\s*[:=]\s*[12]''',
    '''['"]jti['"]\s*:\s*(?:token_jti|claims\.jti|None|['"]['"])''',
    '''['"]token['"]\s*:\s*token\s*,''',
    '''PHINS_EMERGENCY_UNLOCK_KEY''',
]
