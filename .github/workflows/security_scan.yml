name: Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

# Cancel in-flight runs of this workflow when the same ref is pushed again.
# Default branch is NEVER cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  credential-scan:
    name: Scan for Hardcoded Credentials
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for thorough scanning
      
      - name: Run Gitleaks (Credential Scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional for enterprise
        continue-on-error: false
      
      - name: Check for sensitive file patterns
        run: |
          echo "🔍 Checking for sensitive files..."
          
          SENSITIVE_FILES=(
            ".env"
            ".env.local"
            ".env.production"
            "credentials.json"
            "secrets.json"
            "*.pem"
            "*.key"
            "id_rsa"
            "id_dsa"
            "*.p12"
            "*.pfx"
          )
          
          FOUND_SENSITIVE=0
          
          for pattern in "${SENSITIVE_FILES[@]}"; do
            MATCHES=$(find . -name "$pattern" -not -path "./.git/*" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Sensitive file found: $MATCHES"
              FOUND_SENSITIVE=$((FOUND_SENSITIVE + 1))
            fi
          done
          
          if [ $FOUND_SENSITIVE -gt 0 ]; then
            echo ""
            echo "❌ Found $FOUND_SENSITIVE sensitive files that should not be committed!"
            echo "Add these to .gitignore immediately."
            exit 1
          else
            echo "✅ No sensitive files found in repository"
          fi

  dependency-scan:
    name: Scan Dependencies for Vulnerabilities
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install safety
        run: pip install safety
      
      - name: Check Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            echo "🔍 Scanning Python dependencies for vulnerabilities..."
            safety check -r requirements.txt --full-report || true
          else
            echo "No requirements.txt found, skipping Python dependency scan"
          fi
      
      - name: Check for outdated packages
        run: |
          if [ -f requirements.txt ]; then
            pip install pip-audit
            pip-audit -r requirements.txt || true
          fi

  code-security:
    name: Static Code Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install bandit
        run: pip install bandit
      
      - name: Run Bandit security linter
        run: |
          echo "🔍 Running Bandit security analysis..."
          bandit -r . \
            --exclude "./.git,./node_modules,./__pycache__,./tests,./venv,./.venv" \
            -f json -o bandit-report.json || true
          
          # Display high severity issues
          if [ -f bandit-report.json ]; then
          HIGH_ISSUES=$(python3 <<'PY'
          import json
          
          with open('bandit-report.json', 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          
          issues = [
              issue for issue in data.get('results', [])
              if issue.get('issue_severity') == 'HIGH'
          ]
          print(len(issues))
          PY
          )
            
          if [ "$HIGH_ISSUES" -gt 0 ]; then
            echo "⚠️  Found $HIGH_ISSUES high severity security issues:"
          python3 <<'PY'
          import json
          
          with open('bandit-report.json', 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          
          for issue in data.get('results', []):
              if issue.get('issue_severity') != 'HIGH':
                  continue
              filename = issue.get('filename', '<unknown>')
              line_number = issue.get('line_number', '?')
              issue_text = issue.get('issue_text', 'Unknown issue')
              print(f"  - {filename}:{line_number}: {issue_text}")
          PY
          else
            echo "✅ No high severity issues found"
          fi
          fi
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
