name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PHINS_TEST_MODE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-timeout

      - name: Run critical flake8 checks
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short --timeout=30 -x
