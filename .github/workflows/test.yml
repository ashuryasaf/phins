name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PHINS_TEST_MODE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Run Python syntax smoke test
        run: |
          python - <<'PY'
          import py_compile
          import subprocess
          import sys

          tracked_files = subprocess.check_output(
              ["git", "ls-files", "*.py", ":!backups/*"],
              text=True,
          ).splitlines()

          failures = []
          for path in tracked_files:
              try:
                  py_compile.compile(path, doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append(f"{path}: {exc.msg}")

          if failures:
              for failure in failures:
                  print(failure)
              sys.exit(1)
          print(f"Compiled {len(tracked_files)} Python files successfully")
          PY

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short --timeout=30 -x
