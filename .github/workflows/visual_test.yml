name: Visual PDF test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push cancels the previous run, including on main. Railway waits
# on this check before it promotes a deploy, so a hung apt-get on an older
# main commit must not keep production on the previous release. The S3
# upload below is best-effort and is not the deploy gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install system deps (poppler for pdf2image)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo tee /etc/apt/apt.conf.d/99timeout >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          EOF
          sudo apt-get update
          sudo apt-get install -y poppler-utils || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate PDF
        run: |
          python generate_client_pdf.py --customer CI_TEST --output ci_report.pdf --no-demo

      - name: Convert first page to PNG
        run: |
          python -c 'from pdf2image import convert_from_path; imgs = convert_from_path("ci_report.pdf", first_page=1, last_page=1); imgs[0].save("ci_report_page1.png")'
        continue-on-error: true

      - name: Upload to S3 (presigned URL)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.VISUAL_TEST_BUCKET }}
        run: |
          python visual_upload.py ci_report.pdf ${{ secrets.VISUAL_TEST_BUCKET }} ci_reports/ci_report.pdf
        continue-on-error: true
